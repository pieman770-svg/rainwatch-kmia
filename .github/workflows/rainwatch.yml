name: RainWatch KMIA

on:
  schedule:
        - cron: "5,20,35,50 * * * *"

  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a RainWatch test notification"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  check-rain:
    if: ${{ github.event_name == 'schedule' || inputs.test_notification != true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check KMIA rainfall
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/check_kmia.py

      - name: Commit updated data
        run: |
          git config user.name "RainWatch Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update KMIA observation"
          git push

  test-notification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Send test notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC is not configured."
            exit 1
          fi

          curl --fail --retry 3 \
            -H "Title: RainWatch Test" \
            -H "Priority: high" \
            -H "Tags: test,rainwatch" \
            -d "RainWatch notification test successful. Your KMIA rainfall alert system is connected to ntfy and ready to send rainfall alerts." \
            "https://ntfy.sh/$NTFY_TOPIC"

  deploy:
    needs: check-rain
    if: ${{ needs.check-rain.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
