<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>RainWatch — KMIA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#eef2f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:620px;margin:auto;padding:24px}.head{margin:22px 0 28px}.eyebrow{font-size:12px;letter-spacing:.14em;color:#8995a3}.title{font-size:30px;font-weight:800;margin:5px 0}.sub{color:#8e9aa7}
.card{background:#121922;border:1px solid #26313d;border-radius:22px;padding:24px;margin-bottom:16px}.label{color:#8e9aa7;text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.value{font-size:68px;font-weight:800;margin:14px 0 20px;line-height:1}.unit{font-size:20px;color:#9ba7b3;font-weight:500}
.status{font-weight:750;font-size:16px}.good{color:#86efac}.alert{color:#fca5a5}
.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #222d38;gap:15px}.row:last-child{border:0}
a{color:#9fc7ff}.small{font-size:12px;color:#75818d;line-height:1.5}
</style>
</head>
<body>
<main>
<div class="head"><div class="eyebrow">RAIN MONITOR</div><div class="title">KMIA</div><div class="sub">Miami International Airport</div></div>
<section class="card">
<div class="label">1-hour precipitation</div>
<div class="value"><span id="rain">—</span><span class="unit"> in/hr</span></div>
<div id="status" class="status">Loading…</div>
</section>
<section class="card">
<div class="row"><span>Alert threshold</span><strong>0.10 in/hr</strong></div>
<div class="row"><span>Observation</span><strong id="obs">—</strong></div>
<div class="row"><span>Last check</span><strong id="check">—</strong></div>
</section>
<section class="card small">
This monitor checks only KMIA and alerts when the NWS 1-hour precipitation value is at or above 0.10 inches.
<br><br><a href="https://forecast.weather.gov/data/obhistory/KMIA.html">Open NOAA observation history</a>
</section>
</main>
<script>
async function load(){
  try{
    const d=await fetch("data.json?"+Date.now()).then(r=>r.json());
    document.querySelector("#rain").textContent=d.rain_1hr_in==null?"—":Number(d.rain_1hr_in).toFixed(2);
    document.querySelector("#obs").textContent=d.observed_at?new Date(d.observed_at).toLocaleString():"—";
    document.querySelector("#check").textContent=d.fetched_at?new Date(d.fetched_at).toLocaleString():"—";
    const s=document.querySelector("#status");
    if(d.rain_1hr_in!=null && d.rain_1hr_in>=d.threshold_in_hr){
      s.textContent="🌧️ THRESHOLD REACHED";s.className="status alert";
    }else{s.textContent="✓ Below threshold";s.className="status good";}
  }catch(e){document.querySelector("#status").textContent="Unable to load latest observation";}
}
load();setInterval(load,60000);
</script>
</body>
</html>
